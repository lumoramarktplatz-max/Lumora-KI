<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>Lumora-KI</title>
<script>
function lumoraSeason(){var m=new Date().getMonth();return m>=2&&m<=4?'fruehling':m>=5&&m<=7?'sommer':m>=8&&m<=10?'herbst':'winter'}
try{var p=localStorage.getItem('lumora-theme')||'auto';document.documentElement.dataset.theme=p==='auto'?lumoraSeason():p}catch(e){document.documentElement.dataset.theme=lumoraSeason()}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3Cpath d='M16 6l2.6 7.4L26 16l-7.4 2.6L16 26l-2.6-7.4L6 16l7.4-2.6z' fill='white'/%3E%3C/svg%3E">
<style>
  /* ===================== THEMES ===================== */
  :root, html[data-theme="aurora"] {
    --bg:#07071a; --text:#eef0ff; --muted:#9a9cc4;
    --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --line:rgba(255,255,255,.10);
    --a:#a78bfa; --b:#22d3ee; --c:#f472b6; --link:#22d3ee;
    --grad:linear-gradient(135deg,#8b5cf6,#06b6d4); --ubub:linear-gradient(135deg,rgba(139,92,246,.88),rgba(99,102,241,.88));
    --b1:#6d28d9; --b2:#0891b2; --b3:#be185d; --bo:.45;
    --dot:rgba(255,255,255,.07); --hdr:rgba(7,7,26,.55); --side:rgba(7,7,26,.45); --sidem:rgba(10,10,30,.97);
    --glow:rgba(139,92,246,.65); --glow2:rgba(34,211,238,.65); --ring:rgba(167,139,250,.25); --pshadow:rgba(99,102,241,.4);
    --shadow:rgba(0,0,0,.5); --shadow2:rgba(0,0,0,.35); --hl:rgba(255,255,255,.08); --inp:rgba(0,0,0,.35);
    --icode:rgba(0,0,0,.4); --icodec:#c4b5fd; --errc:#fda4af; --thumb:rgba(255,255,255,.12);
    --l1:#c4b5fd; --l2:#67e8f9; --h1a:#fff; --h1b:#c4b5fd; --h1c:#67e8f9;
  }
  html[data-theme="fruehling"] {
    --bg:#f3fbf1; --text:#1d3a2b; --muted:#5d7d69;
    --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.85); --line:rgba(30,90,60,.14);
    --a:#16a34a; --b:#db2777; --c:#eab308; --link:#be185d;
    --grad:linear-gradient(135deg,#34d399,#f472b6); --ubub:linear-gradient(135deg,#10b981,#ec4899);
    --b1:#fbcfe8; --b2:#bbf7d0; --b3:#fef08a; --bo:.75;
    --dot:rgba(22,101,52,.08); --hdr:rgba(243,251,241,.7); --side:rgba(255,255,255,.5); --sidem:rgba(243,251,241,.98);
    --glow:rgba(244,114,182,.55); --glow2:rgba(52,211,153,.6); --ring:rgba(52,211,153,.3); --pshadow:rgba(16,185,129,.35);
    --shadow:rgba(30,90,60,.18); --shadow2:rgba(30,90,60,.12); --hl:rgba(255,255,255,.9); --inp:rgba(255,255,255,.75);
    --icode:rgba(22,101,52,.1); --icodec:#047857; --errc:#e11d48; --thumb:rgba(30,90,60,.2);
    --l1:#059669; --l2:#db2777; --h1a:#14532d; --h1b:#059669; --h1c:#db2777;
  }
  html[data-theme="sommer"] {
    --bg:#fff7e0; --text:#3d2a05; --muted:#8a6b2e;
    --glass:rgba(255,255,255,.6); --glass2:rgba(255,255,255,.88); --line:rgba(140,90,10,.16);
    --a:#ea580c; --b:#0891b2; --c:#e11d48; --link:#0e7490;
    --grad:linear-gradient(135deg,#fb923c,#f43f5e); --ubub:linear-gradient(135deg,#f97316,#e11d48);
    --b1:#fdba74; --b2:#67e8f9; --b3:#fde047; --bo:.7;
    --dot:rgba(180,83,9,.09); --hdr:rgba(255,247,224,.72); --side:rgba(255,255,255,.5); --sidem:rgba(255,247,224,.98);
    --glow:rgba(251,146,60,.65); --glow2:rgba(250,204,21,.7); --ring:rgba(251,146,60,.3); --pshadow:rgba(244,63,94,.35);
    --shadow:rgba(140,90,10,.2); --shadow2:rgba(140,90,10,.14); --hl:rgba(255,255,255,.9); --inp:rgba(255,255,255,.78);
    --icode:rgba(180,83,9,.1); --icodec:#c2410c; --errc:#be123c; --thumb:rgba(140,90,10,.22);
    --l1:#ea580c; --l2:#e11d48; --h1a:#7c2d12; --h1b:#ea580c; --h1c:#e11d48;
  }
  html[data-theme="herbst"] {
    --bg:#1a0e07; --text:#fdf1e4; --muted:#c4a58a;
    --glass:rgba(255,236,214,.06); --glass2:rgba(255,236,214,.11); --line:rgba(255,200,150,.14);
    --a:#fb923c; --b:#fbbf24; --c:#f87171; --link:#fbbf24;
    --grad:linear-gradient(135deg,#ea580c,#b91c1c); --ubub:linear-gradient(135deg,rgba(234,88,12,.92),rgba(185,28,28,.92));
    --b1:#c2410c; --b2:#92400e; --b3:#7f1d1d; --bo:.5;
    --dot:rgba(255,200,150,.07); --hdr:rgba(26,14,7,.6); --side:rgba(26,14,7,.5); --sidem:rgba(30,16,8,.97);
    --glow:rgba(249,115,22,.65); --glow2:rgba(251,191,36,.6); --ring:rgba(251,146,60,.28); --pshadow:rgba(234,88,12,.4);
    --shadow:rgba(0,0,0,.55); --shadow2:rgba(0,0,0,.4); --hl:rgba(255,230,200,.09); --inp:rgba(0,0,0,.35);
    --icode:rgba(0,0,0,.4); --icodec:#fdba74; --errc:#fca5a5; --thumb:rgba(255,200,150,.14);
    --l1:#fdba74; --l2:#fcd34d; --h1a:#fff7ed; --h1b:#fdba74; --h1c:#fcd34d;
  }
  html[data-theme="winter"] {
    --bg:#06101f; --text:#eaf4ff; --muted:#93acc9;
    --glass:rgba(220,238,255,.07); --glass2:rgba(220,238,255,.12); --line:rgba(180,215,255,.16);
    --a:#7dd3fc; --b:#c4b5fd; --c:#e0f2fe; --link:#7dd3fc;
    --grad:linear-gradient(135deg,#3b82f6,#67e8f9); --ubub:linear-gradient(135deg,rgba(59,130,246,.9),rgba(14,165,233,.9));
    --b1:#1d4ed8; --b2:#0e7490; --b3:#6d28d9; --bo:.42;
    --dot:rgba(200,230,255,.08); --hdr:rgba(6,16,31,.6); --side:rgba(6,16,31,.5); --sidem:rgba(8,18,34,.97);
    --glow:rgba(96,165,250,.65); --glow2:rgba(103,232,249,.65); --ring:rgba(125,211,252,.28); --pshadow:rgba(59,130,246,.4);
    --shadow:rgba(0,0,0,.55); --shadow2:rgba(0,0,0,.4); --hl:rgba(220,238,255,.1); --inp:rgba(0,0,0,.35);
    --icode:rgba(0,0,0,.4); --icodec:#bae6fd; --errc:#fda4af; --thumb:rgba(180,215,255,.16);
    --l1:#bae6fd; --l2:#ddd6fe; --h1a:#fff; --h1b:#bae6fd; --h1c:#ddd6fe;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    margin:0; display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    background:var(--bg); color:var(--text); transition:background .5s, color .3s;
    font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }

  /* ---------- Hintergrund ---------- */
  .aurora { position:fixed; inset:0; z-index:-2; overflow:hidden; }
  .aurora i { position:absolute; width:60vmax; height:60vmax; border-radius:50%; filter:blur(90px); opacity:var(--bo); animation:float 22s ease-in-out infinite; transition:background .8s, opacity .8s; }
  .aurora i:nth-child(1) { background:var(--b1); top:-25vmax; left:-15vmax; }
  .aurora i:nth-child(2) { background:var(--b2); bottom:-30vmax; right:-15vmax; animation-delay:-8s; }
  .aurora i:nth-child(3) { background:var(--b3); width:40vmax; height:40vmax; top:35%; left:45%; opacity:calc(var(--bo) * .5); animation-delay:-14s; }
  @keyframes float { 0%,100% { transform:translate(0,0) scale(1); } 33% { transform:translate(6vmax,4vmax) scale(1.1); } 66% { transform:translate(-4vmax,7vmax) scale(.95); } }
  .aurora::after { content:""; position:absolute; inset:0; background-image:radial-gradient(var(--dot) 1px,transparent 1px); background-size:28px 28px; mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%); -webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%); }
  #fx { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }

  /* ---------- Kopfzeile ---------- */
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; padding-top:calc(12px + env(safe-area-inset-top)); border-bottom:1px solid var(--line); background:var(--hdr); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); position:relative; z-index:30; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; letter-spacing:-.02em; }
  .logo svg { filter:drop-shadow(0 0 10px var(--glow)); }
  .logo b { background:linear-gradient(90deg,var(--l1),var(--l2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #menu { display:none; background:var(--glass); border:1px solid var(--line); color:var(--text); width:38px; height:38px; border-radius:10px; font-size:18px; cursor:pointer; }
  #themewrap { margin-left:auto; position:relative; }
  #themebtn { font-size:18px; padding:4px 12px; line-height:1.5; }
  #themes { display:none; position:absolute; right:0; top:calc(100% + 10px); min-width:180px; padding:8px; border-radius:16px; background:var(--sidem); border:1px solid var(--line); box-shadow:0 20px 50px var(--shadow); flex-direction:column; gap:2px; animation:pop .2s both; }
  #themes.open { display:flex; }
  #themes button { display:flex; align-items:center; gap:10px; background:none; border:0; color:var(--text); font:inherit; font-size:15px; padding:9px 12px; border-radius:10px; cursor:pointer; text-align:left; }
  #themes button:hover { background:var(--glass2); }
  #themes button.on { background:var(--glass2); box-shadow:inset 3px 0 0 var(--a); }
  #themes small { color:var(--muted); font-size:12px; margin-left:auto; }
  #themes .sep { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:8px 12px 4px; }
  #themes .sw { width:18px; height:18px; border-radius:50%; flex-shrink:0; }
  #who { display:none; align-items:center; gap:10px; font-size:14px; color:var(--muted); }
  #uname { display:flex; align-items:center; gap:8px; }
  #uname::before { content:attr(data-i); display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--grad); color:#fff; font-weight:700; font-size:13px; }
  .ghost { background:var(--glass); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:6px 14px; font:inherit; font-size:14px; cursor:pointer; transition:.2s; }
  .ghost:hover { background:var(--glass2); }

  /* ---------- Anmeldung ---------- */
  #auth { display:none; margin:auto; width:min(400px,92vw); flex-direction:column; gap:14px; padding:34px 30px; border-radius:24px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); box-shadow:0 30px 80px var(--shadow), inset 0 1px 0 var(--hl); animation:pop .5s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { opacity:0; transform:translateY(20px) scale(.96); } }
  .orb { width:68px; height:68px; margin:0 auto 4px; border-radius:50%; background:var(--grad); display:grid; place-items:center; box-shadow:0 0 50px var(--glow); animation:pulse 3.5s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 70px var(--glow2); transform:scale(1.05); } }
  #auth h2 { margin:6px 0 0; text-align:center; font-size:26px; letter-spacing:-.02em; }
  #auth p { margin:0 0 6px; text-align:center; color:var(--muted); font-size:14px; }
  #auth input { background:var(--inp); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:13px 14px; font:inherit; outline:none; transition:.2s; }
  #auth input:focus { border-color:var(--a); box-shadow:0 0 0 3px var(--ring); }
  .primary { background:var(--grad); color:#fff; border:0; border-radius:12px; padding:13px; font:inherit; font-weight:700; cursor:pointer; box-shadow:0 8px 24px var(--pshadow); transition:.2s; }
  .primary:hover { transform:translateY(-1px); filter:brightness(1.08); }
  .primary:active { transform:none; }
  #err { color:var(--errc); min-height:1.3em; font-size:14px; text-align:center; }
  .link { background:none; border:0; color:var(--link); font:inherit; font-size:14px; cursor:pointer; padding:0; }
  .link:hover { text-decoration:underline; }

  /* ---------- Hauptbereich ---------- */
  #main { flex:1; display:none; min-height:0; }
  #side { width:280px; flex-shrink:0; display:flex; flex-direction:column; gap:10px; padding:14px; overflow-y:auto; background:var(--side); border-right:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  #newchat { display:flex; align-items:center; justify-content:center; gap:8px; }
  .ci { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:12px; cursor:pointer; color:var(--muted); border:1px solid transparent; transition:.15s; animation:slide .3s both; }
  @keyframes slide { from { opacity:0; transform:translateX(-8px); } }
  .ci:hover { background:var(--glass); color:var(--text); }
  .ci.on { background:var(--glass2); color:var(--text); border-color:var(--line); box-shadow:inset 3px 0 0 var(--a); }
  .ci span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  .ci .del { background:none; border:0; color:var(--muted); cursor:pointer; opacity:0; transition:.15s; font-size:14px; padding:2px 4px; }
  .ci:hover .del, .ci.on .del { opacity:.8; }
  .ci .del:hover { color:var(--errc); opacity:1; }
  #col { flex:1; display:flex; flex-direction:column; min-width:0; }
  #chat { flex:1; min-height:0; overflow-y:auto; scroll-behavior:smooth; padding:24px 18px 8px; display:flex; flex-direction:column; gap:22px; width:100%; max-width:820px; margin:0 auto; }
  #chat::-webkit-scrollbar, #side::-webkit-scrollbar { width:8px; }
  #chat::-webkit-scrollbar-thumb, #side::-webkit-scrollbar-thumb { background:var(--thumb); border-radius:8px; }

  /* ---------- Nachrichten ---------- */
  .row { display:flex; gap:12px; animation:rise .35s both; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }
  .row.user { flex-direction:row-reverse; }
  .av { flex-shrink:0; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:14px; }
  .row.bot .av { background:var(--grad); color:#fff; box-shadow:0 0 18px var(--glow); }
  .row.user .av { background:var(--glass2); border:1px solid var(--line); }
  .msg { min-width:0; max-width:calc(100% - 50px); padding:12px 16px; border-radius:18px; word-wrap:break-word; overflow-wrap:anywhere; }
  .user .msg { background:var(--ubub); color:#fff; border-bottom-right-radius:6px; box-shadow:0 8px 24px var(--pshadow); white-space:pre-wrap; }
  .bot .msg { background:var(--glass); border:1px solid var(--line); border-bottom-left-radius:6px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .msg p { margin:0 0 10px; } .msg p:last-child, .msg ul:last-child, .msg ol:last-child { margin-bottom:0; }
  .msg h1,.msg h2,.msg h3 { margin:14px 0 8px; line-height:1.3; letter-spacing:-.01em; } .msg h1 { font-size:1.35em; } .msg h2 { font-size:1.2em; } .msg h3 { font-size:1.05em; }
  .msg ul,.msg ol { margin:0 0 10px; padding-left:22px; } .msg li { margin:3px 0; }
  .msg a { color:var(--link); }
  .msg blockquote { margin:0 0 10px; padding:4px 14px; border-left:3px solid var(--a); color:var(--muted); }
  .msg code { background:var(--icode); padding:2px 6px; border-radius:6px; font:0.88em ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--icodec); }
  .code { margin:4px 0 12px; border-radius:12px; overflow:hidden; background:rgba(15,23,42,.93); border:1px solid rgba(255,255,255,.1); }
  .code .bar { display:flex; justify-content:space-between; align-items:center; padding:6px 12px; font-size:12px; color:#94a3b8; background:rgba(255,255,255,.06); }
  .code .bar button { background:none; border:0; color:#94a3b8; cursor:pointer; font:inherit; font-size:12px; }
  .code .bar button:hover { color:#fff; }
  .code pre { margin:0; padding:12px 14px; overflow-x:auto; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .msg .code pre code { background:none; padding:0; color:#e2e8f0; }
  .dots { display:inline-flex; gap:5px; padding:6px 0; }
  .dots i { width:8px; height:8px; border-radius:50%; background:var(--a); animation:bounce 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay:.15s; background:var(--b); } .dots i:nth-child(3) { animation-delay:.3s; background:var(--c); }
  @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:.5; } 30% { transform:translateY(-6px); opacity:1; } }

  /* ---------- Startbildschirm ---------- */
  .hint { margin:auto; text-align:center; padding:20px; animation:rise .6s both; }
  .hint .orb { width:84px; height:84px; margin-bottom:18px; }
  .hint h1 { margin:0 0 6px; font-size:clamp(28px,5vw,40px); letter-spacing:-.03em; background:linear-gradient(90deg,var(--h1a),var(--h1b) 50%,var(--h1c)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hint p { margin:0 0 26px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:640px; margin:0 auto; }
  .chip { background:var(--glass); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:10px 16px; font:inherit; font-size:14px; cursor:pointer; transition:.2s; }
  .chip:hover { background:var(--glass2); border-color:var(--a); transform:translateY(-2px); box-shadow:0 8px 20px var(--ring); }

  /* ---------- Eingabe ---------- */
  #form { display:flex; align-items:flex-end; gap:10px; width:100%; max-width:820px; margin:0 auto; padding:10px 18px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
  .box { flex:1; display:flex; align-items:flex-end; gap:8px; padding:8px 8px 8px 16px; border-radius:22px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); transition:.2s; box-shadow:0 10px 40px var(--shadow2); }
  .box:focus-within { border-color:var(--a); box-shadow:0 0 0 3px var(--ring), 0 10px 40px var(--shadow2); }
  #input { flex:1; resize:none; background:none; border:0; outline:none; color:var(--text); font:inherit; padding:8px 0; max-height:180px; }
  #input::placeholder { color:var(--muted); }
  #send { width:42px; height:42px; flex-shrink:0; border:0; border-radius:50%; background:var(--grad); color:#fff; cursor:pointer; display:grid; place-items:center; transition:.2s; box-shadow:0 6px 18px var(--pshadow); }
  #send:hover { transform:scale(1.08) rotate(-8deg); }
  #send:disabled { opacity:.4; cursor:default; transform:none; }

  @media (max-width:760px) {
    #menu { display:block; }
    #side { position:fixed; top:0; bottom:0; left:0; z-index:20; padding-top:calc(70px + env(safe-area-inset-top)); width:82vw; max-width:320px; background:var(--sidem); transform:translateX(-105%); transition:transform .25s; box-shadow:20px 0 60px var(--shadow); }
    #side.open { transform:none; }
    #who #uname { display:none; }
    .msg { max-width:calc(100% - 46px); }
  }
  @media (prefers-reduced-motion: reduce) { .aurora i, .orb { animation:none; } }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>

<header>
  <button id="menu" type="button" aria-label="Menü">☰</button>
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle cx="16" cy="16" r="15" fill="url(#lg)"/><path d="M16 6l2.6 7.4L26 16l-7.4 2.6L16 26l-2.6-7.4L6 16l7.4-2.6z" fill="#fff"/></svg>
    <b>Lumora</b>
  </div>
  <div id="themewrap">
    <button id="themebtn" class="ghost" type="button" aria-label="Design wählen" title="Design wählen">🌌</button>
    <div id="themes"></div>
  </div>
  <div id="who"><span id="uname"></span><button id="logout" class="ghost" type="button">Abmelden</button></div>
</header>

<form id="auth" autocomplete="on">
  <div class="orb"><svg width="34" height="34" viewBox="0 0 32 32"><path d="M16 4l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fff"/></svg></div>
  <h2 id="atitle">Willkommen zurück</h2>
  <p id="asub">Melde dich an, um mit Lumora zu chatten.</p>
  <input id="user" placeholder="Benutzername" autocomplete="username" required>
  <input id="pass" type="password" placeholder="Passwort (min. 8 Zeichen)" autocomplete="current-password" required>
  <div id="err"></div>
  <button id="abtn" class="primary">Anmelden</button>
  <button id="toggle" type="button" class="link">Noch kein Konto? Registrieren</button>
</form>

<div id="main">
  <div id="side">
    <button class="primary" id="newchat" type="button"><span style="font-size:18px;line-height:1">+</span> Neuer Chat</button>
    <div id="list"></div>
  </div>
  <div id="col">
    <div id="chat"></div>
    <form id="form">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Frag Lumora irgendetwas…" autofocus></textarea>
        <button id="send" type="submit" aria-label="Senden"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </form>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const $ = id => document.getElementById(id);
const list = $('list');
let registering = false;
let currentId = null;


/* ---------- Jahreszeiten-Themes ---------- */
const THEMES = {
  aurora:    { name: 'Aurora',   icon: '🌌', sw: 'linear-gradient(135deg,#8b5cf6,#06b6d4)', color: '#07071a' },
  fruehling: { name: 'Frühling', icon: '🌸', sw: 'linear-gradient(135deg,#34d399,#f472b6)', color: '#f3fbf1',
               fx: { chars: ['🌸', '🌷', '🍃', '🌼'], n: 22, vy: [.5, 1.1], sway: 1.2, size: [16, 26], spin: 1 } },
  sommer:    { name: 'Sommer',   icon: '☀️', sw: 'linear-gradient(135deg,#fb923c,#f43f5e)', color: '#fff7e0',
               fx: { chars: ['✨', '☀️', '🌻', '🫧'], n: 28, vy: [-.6, -.25], sway: .8, size: [14, 28], twinkle: true } },
  herbst:    { name: 'Herbst',   icon: '🍂', sw: 'linear-gradient(135deg,#ea580c,#b91c1c)', color: '#1a0e07',
               fx: { chars: ['🍂', '🍁', '🍂', '🌰'], n: 24, vy: [.7, 1.5], sway: 1.8, size: [16, 28], spin: 2 } },
  winter:    { name: 'Winter',   icon: '❄️', sw: 'linear-gradient(135deg,#3b82f6,#67e8f9)', color: '#06101f',
               fx: { chars: ['❄', '❅', '❆', '•'], n: 55, vy: [.4, 1.2], sway: .7, size: [8, 20], snow: true } },
};
const root = document.documentElement;
const fx = $('fx'), g = fx.getContext('2d');
let parts = [], raf = 0, W = 0, H = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);

function sizeFx() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  fx.width = W * d; fx.height = H * d;
  g.setTransform(d, 0, 0, d, 0, 0);
}
function spawn(c, first) {
  return { ch: c.chars[Math.floor(Math.random() * c.chars.length)],
    x: rnd(0, W), y: first ? rnd(0, H) : (c.vy[0] < 0 ? H + 30 : -30),
    s: rnd(c.size[0], c.size[1]), vy: rnd(c.vy[0], c.vy[1]), ph: rnd(0, 6.28), sp: rnd(.4, 1),
    r: rnd(0, 6.28), rs: rnd(-.02, .02) * (c.spin || 0), o: rnd(.45, .95) };
}
function frame(t) {
  const c = THEMES[root.dataset.theme]?.fx;
  g.clearRect(0, 0, W, H);
  if (!c) return;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.y += p.vy; p.ph += .015 * p.sp; p.r += p.rs;
    p.x += Math.sin(p.ph) * c.sway;
    if (p.y > H + 40 || p.y < -40 || p.x < -40 || p.x > W + 40) parts[i] = spawn(c, false);
    g.save();
    g.globalAlpha = c.twinkle ? p.o * (.5 + .5 * Math.sin(t / 600 + p.ph * 4)) : p.o;
    g.translate(p.x, p.y); g.rotate(p.r);
    g.font = p.s + 'px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (c.snow) g.fillStyle = '#fff';
    g.fillText(p.ch, 0, 0);
    g.restore();
  }
  raf = requestAnimationFrame(frame);
}
function startFx() {
  cancelAnimationFrame(raf);
  g.clearRect(0, 0, W, H);
  const c = THEMES[root.dataset.theme]?.fx;
  parts = [];
  if (!c || reduce) return;
  parts = Array.from({ length: c.n }, () => spawn(c, true));
  raf = requestAnimationFrame(frame);
}
const pref = () => { try { return localStorage.getItem('lumora-theme') || 'auto'; } catch (e) { return 'auto'; } };
const season = () => { const m = new Date().getMonth(); return m >= 2 && m <= 4 ? 'fruehling' : m >= 5 && m <= 7 ? 'sommer' : m >= 8 && m <= 10 ? 'herbst' : 'winter'; };
function applyPref(p, save) {
  if (p !== 'auto' && !THEMES[p]) p = 'auto';
  if (save) { try { localStorage.setItem('lumora-theme', p); } catch (e) {} }
  const id = p === 'auto' ? season() : p;
  root.dataset.theme = id;
  $('themebtn').textContent = THEMES[id].icon;
  document.querySelector('meta[name=theme-color]').content = THEMES[id].color;
  document.querySelectorAll('#themes button').forEach(b => b.classList.toggle('on', b.dataset.id === p));
  startFx();
}
function addOpt(id, html) {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.id = id; b.innerHTML = html;
  b.onclick = () => { applyPref(id, true); $('themes').classList.remove('open'); };
  $('themes').appendChild(b);
}
const sep = t => { const d = document.createElement('div'); d.className = 'sep'; d.textContent = t; $('themes').appendChild(d); };
addOpt('auto', '<span class="sw" style="background:conic-gradient(#34d399,#fb923c,#ea580c,#3b82f6,#34d399)"></span>Automatisch <small>Jahreszeit</small>');
addOpt('aurora', '<span class="sw" style="background:' + THEMES.aurora.sw + '"></span>' + THEMES.aurora.icon + ' Normal');
sep('Manuell wählen');
for (const id of ['fruehling', 'sommer', 'herbst', 'winter']) {
  const t = THEMES[id];
  addOpt(id, '<span class="sw" style="background:' + t.sw + '"></span>' + t.icon + ' ' + t.name);
}
$('themebtn').onclick = e => { e.stopPropagation(); $('themes').classList.toggle('open'); };
document.addEventListener('click', e => { if (!e.target.closest('#themewrap')) $('themes').classList.remove('open'); });
addEventListener('resize', sizeFx);
sizeFx();
applyPref(pref(), false);

const SUGGESTIONS = [
  '✨ Erkläre mir etwas Spannendes',
  '💡 Gib mir eine kreative Idee',
  '🧑‍💻 Hilf mir beim Programmieren',
  '🌍 Übersetze einen Satz für mich',
];

/* ---------- Markdown (sicher: erst escapen, dann formatieren) ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(t) {
  t = esc(t);
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return t;
}
function markdown(src) {
  const blocks = [];
  src = src.replace(/```([\w+#-]*)\n?([\s\S]*?)(```|$)/g, (_, lang, code) => {
    blocks.push(
      '<div class="code"><div class="bar"><span>' + esc(lang || 'code') +
      '</span><button type="button" data-copy>Kopieren</button></div><pre><code>' +
      esc(code.replace(/\n$/, '')) + '</code></pre></div>');
    return '\n@@B' + (blocks.length - 1) + '@@\n';
  });
  const out = [];
  let listType = null;
  const close = () => { if (listType) { out.push('</' + listType + '>'); listType = null; } };
  for (const line of src.split('\n')) {
    let m;
    if ((m = line.match(/^@@B(\d+)@@$/))) { close(); out.push(blocks[+m[1]]); }
    else if ((m = line.match(/^(#{1,3})\s+(.*)/))) { close(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (listType !== 'ul') { close(); out.push('<ul>'); listType = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (listType !== 'ol') { close(); out.push('<ol>'); listType = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if ((m = line.match(/^>\s?(.*)/))) { close(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); }
    else if (!line.trim()) { close(); }
    else { close(); out.push('<p>' + inline(line) + '</p>'); }
  }
  close();
  return out.join('');
}
chat.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  navigator.clipboard?.writeText(b.closest('.code').querySelector('code').textContent);
  b.textContent = 'Kopiert ✓';
  setTimeout(() => (b.textContent = 'Kopieren'), 1500);
});

/* ---------- Ansicht ---------- */
function showApp(name) {
  $('auth').style.display = 'none';
  $('main').style.display = 'flex';
  $('who').style.display = 'flex';
  $('uname').textContent = name; $('uname').dataset.i = name[0].toUpperCase();
  loadChats(true);
}
function showAuth() {
  $('main').style.display = 'none';
  $('who').style.display = 'none';
  $('auth').style.display = 'flex';
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) { showAuth(); throw new Error('auth'); }
  return r;
}
function hint() {
  chat.innerHTML = '';
  const h = document.createElement('div');
  h.className = 'hint';
  h.innerHTML = '<div class="orb"><svg width="40" height="40" viewBox="0 0 32 32"><path d="M16 4l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fff"/></svg></div>' +
    '<h1>Hallo, ich bin Lumora</h1><p>Deine KI für alles. Frag mich, was du willst.</p><div class="chips"></div>';
  for (const s of SUGGESTIONS) {
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'chip'; c.textContent = s;
    c.onclick = () => { input.value = s.replace(/^\S+\s/, ''); grow(); input.focus(); };
    h.querySelector('.chips').appendChild(c);
  }
  chat.appendChild(h);
}
async function loadChats(openFirst) {
  const chats = await (await api('/api/chats')).json();
  list.innerHTML = '';
  chats.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'ci' + (c.id === currentId ? ' on' : '');
    d.style.animationDelay = i * 25 + 'ms';
    const t = document.createElement('span'); t.textContent = c.title;
    const x = document.createElement('button'); x.className = 'del'; x.textContent = '✕'; x.title = 'Löschen';
    x.onclick = async e => {
      e.stopPropagation();
      if (!confirm('Diesen Chat löschen?')) return;
      await api('/api/chats/' + c.id, { method: 'DELETE' });
      if (c.id === currentId) { currentId = null; hint(); }
      loadChats();
    };
    d.onclick = () => openChat(c.id);
    d.append(t, x);
    list.appendChild(d);
  });
  if (openFirst) { if (chats.length) openChat(chats[0].id); else hint(); }
}
async function openChat(id) {
  currentId = id;
  $('side').classList.remove('open');
  const c = await (await api('/api/chats/' + id)).json();
  chat.innerHTML = '';
  if (!c.messages.length) hint();
  for (const m of c.messages) add(m.role === 'user' ? 'user' : 'bot', m.content);
  chat.style.scrollBehavior = 'auto'; chat.scrollTop = chat.scrollHeight; chat.style.scrollBehavior = '';
  loadChats();
}
$('newchat').onclick = async () => {
  const c = await (await api('/api/chats', { method: 'POST' })).json();
  currentId = c.id; hint(); loadChats(); input.focus();
  $('side').classList.remove('open');
};
$('menu').onclick = () => $('side').classList.toggle('open');
chat.addEventListener('click', () => $('side').classList.remove('open'));

/* ---------- Anmeldung ---------- */
function setMode(reg) {
  registering = reg;
  $('atitle').textContent = reg ? 'Konto erstellen' : 'Willkommen zurück';
  $('asub').textContent = reg ? 'Erstelle dein kostenloses Lumora-Konto.' : 'Melde dich an, um mit Lumora zu chatten.';
  $('abtn').textContent = reg ? 'Registrieren' : 'Anmelden';
  $('toggle').textContent = reg ? 'Schon ein Konto? Anmelden' : 'Noch kein Konto? Registrieren';
  $('pass').autocomplete = reg ? 'new-password' : 'current-password';
  $('err').textContent = '';
}
$('toggle').onclick = () => setMode(!registering);
$('auth').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await fetch(registering ? '/api/register' : '/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: $('user').value, password: $('pass').value }),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { $('err').textContent = typeof j.detail === 'string' ? j.detail : 'Ungültige Eingabe'; return; }
  $('pass').value = '';
  showApp(j.username);
});
$('logout').onclick = async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
};
(async () => {
  const r = await fetch('/api/me');
  if (r.ok) showApp((await r.json()).username); else showAuth();
})();

/* ---------- Chat ---------- */
function add(role, text) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'user' ? ($('uname').dataset.i || '•') : '✦';
  const d = document.createElement('div');
  d.className = 'msg';
  setText(d, role, text);
  row.append(av, d);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function setText(el, role, text) {
  if (role === 'user' || el.closest('.row')?.classList.contains('user')) el.textContent = text;
  else el.innerHTML = markdown(text);
}
function setBot(el, text) { el.innerHTML = markdown(text); }

function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; }
input.addEventListener('input', grow);

async function submit() {
  const text = input.value.trim();
  if (!text || send.disabled) return;
  send.disabled = true;
  try {
    if (currentId === null) {
      const c = await (await api('/api/chats', { method: 'POST' })).json();
      currentId = c.id;
    }
    chat.querySelector('.hint')?.remove();
    input.value = ''; grow();
    add('user', text);
    const bot = add('bot', '');
    bot.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
    let answer = '';
    const res = await api('/api/chats/' + currentId + '/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      bot.textContent = '⚠️ ' + (j.detail || 'Fehler');
    } else {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const p of parts) {
          const data = p.replace(/^data: /, '');
          if (data === '[DONE]') continue;
          const j = JSON.parse(data);
          answer += j.error ? '\n\n⚠️ ' + j.error : j.text;
          setBot(bot, answer);
          chat.scrollTop = chat.scrollHeight;
        }
      }
      if (!answer) bot.textContent = '⚠️ Keine Antwort erhalten.';
    }
  } catch (e) {
    if (e.message !== 'auth') add('bot', '⚠️ Verbindungsfehler: ' + e.message);
  }
  send.disabled = false;
  loadChats();
  input.focus();
}

$('form').addEventListener('submit', e => { e.preventDefault(); submit(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
</script>
</body>
</html>
