<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumora-KI</title>
<style>
  :root { --bg:#0f1020; --panel:#1a1b33; --accent:#8b7cff; --text:#ececf5; --muted:#9a9bb8; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; }
  header { padding:14px 20px; font-weight:700; font-size:20px; border-bottom:1px solid #2a2b4a; }
  header span { color:var(--accent); }
  #main { flex:1; display:none; min-height:0; }
  #side { width:260px; background:var(--panel); display:flex; flex-direction:column; padding:12px; gap:8px; overflow-y:auto; }
  #side button.new { padding:10px; }
  .ci { display:flex; align-items:center; gap:6px; padding:8px 10px; border-radius:10px; cursor:pointer; color:var(--muted); }
  .ci:hover, .ci.on { background:var(--bg); color:var(--text); }
  .ci span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ci .del { background:none; color:var(--muted); padding:0 4px; }
  #col { flex:1; display:flex; flex-direction:column; min-width:0; }
  #menu { display:none; background:none; color:var(--text); font-size:22px; padding:0 12px 0 0; }
  @media (max-width:700px) {
    #side { position:fixed; top:55px; bottom:0; left:0; z-index:5; transform:translateX(-100%); transition:transform .2s; }
    #side.open { transform:none; }
    #menu { display:block; }
  }
  #chat { flex:1; min-height:0; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; max-width:800px; width:100%; margin:0 auto; }
  .msg { padding:12px 16px; border-radius:14px; max-width:85%; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .bot { align-self:flex-start; background:var(--panel); }
  .hint { color:var(--muted); text-align:center; margin-top:20vh; }
  form { display:flex; gap:10px; padding:16px 20px; max-width:800px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid #2a2b4a; border-radius:12px; padding:12px; font:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:0 22px; font:inherit; font-weight:600; cursor:pointer; }
  #auth { display:none; margin:auto; background:var(--panel); padding:28px; border-radius:16px; width:min(360px,90vw); flex-direction:column; gap:12px; }
  #auth h2 { margin:0 0 4px; }
  #auth input { background:var(--bg); color:var(--text); border:1px solid #2a2b4a; border-radius:10px; padding:11px; font:inherit; }
  #auth button { padding:11px; }
  #err { color:#ff8a8a; min-height:1.4em; font-size:14px; }
  .link { background:none; color:var(--accent); padding:0; text-align:center; }
  #who { margin-left:auto; font-size:14px; color:var(--muted); display:none; align-items:center; gap:10px; }
  #who button { padding:4px 12px; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header style="display:flex;align-items:center"><button id="menu" type="button">☰</button><span>✦</span>&nbsp;Lumora-KI
  <div id="who"><span id="uname"></span><button id="logout" type="button">Abmelden</button></div></header>
<form id="auth" autocomplete="on">
  <h2 id="atitle">Anmelden</h2>
  <input id="user" placeholder="Benutzername" autocomplete="username" required>
  <input id="pass" type="password" placeholder="Passwort (min. 8 Zeichen)" autocomplete="current-password" required>
  <div id="err"></div>
  <button id="abtn">Anmelden</button>
  <button id="toggle" type="button" class="link">Noch kein Konto? Registrieren</button>
</form>
<div id="main">
<div id="side"><button class="new" id="newchat" type="button">+ Neuer Chat</button><div id="list"></div></div>
<div id="col">
<div id="chat"><div class="hint">Hallo! Ich bin Lumora. Frag mich alles.</div></div>
<form id="form">
  <textarea id="input" rows="2" placeholder="Schreib eine Nachricht…" autofocus></textarea>
  <button id="send">Senden</button>
</form>
</div></div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const $ = id => document.getElementById(id);
let registering = false;

let currentId = null;
const list = $('list');

function showApp(name) {
  $('auth').style.display = 'none';
  $('main').style.display = 'flex';
  $('who').style.display = 'flex'; $('uname').textContent = name;
  loadChats(true);
}
function showAuth() {
  $('main').style.display = 'none';
  $('who').style.display = 'none'; $('auth').style.display = 'flex';
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) { showAuth(); throw new Error('auth'); }
  return r;
}
function hint() {
  chat.innerHTML = '<div class="hint">Hallo! Ich bin Lumora. Frag mich alles.</div>';
}
async function loadChats(openFirst) {
  const chats = await (await api('/api/chats')).json();
  list.innerHTML = '';
  for (const c of chats) {
    const d = document.createElement('div');
    d.className = 'ci' + (c.id === currentId ? ' on' : '');
    const t = document.createElement('span'); t.textContent = c.title;
    const x = document.createElement('button'); x.className = 'del'; x.textContent = '✕'; x.title = 'Löschen';
    x.onclick = async e => {
      e.stopPropagation();
      if (!confirm('Diesen Chat löschen?')) return;
      await api('/api/chats/' + c.id, { method: 'DELETE' });
      if (c.id === currentId) { currentId = null; hint(); }
      loadChats();
    };
    d.onclick = () => openChat(c.id);
    d.append(t, x);
    list.appendChild(d);
  }
  if (openFirst) { if (chats.length) openChat(chats[0].id); else hint(); }
}
async function openChat(id) {
  currentId = id;
  $('side').classList.remove('open');
  const c = await (await api('/api/chats/' + id)).json();
  chat.innerHTML = '';
  if (!c.messages.length) hint();
  for (const m of c.messages) add(m.role === 'user' ? 'user' : 'bot', m.content);
  loadChats();
}
$('newchat').onclick = async () => {
  const c = await (await api('/api/chats', { method: 'POST' })).json();
  currentId = c.id; hint(); loadChats(); input.focus();
  $('side').classList.remove('open');
};
$('menu').onclick = () => $('side').classList.toggle('open');

function setMode(reg) {
  registering = reg;
  $('atitle').textContent = reg ? 'Konto erstellen' : 'Anmelden';
  $('abtn').textContent = reg ? 'Registrieren' : 'Anmelden';
  $('toggle').textContent = reg ? 'Schon ein Konto? Anmelden' : 'Noch kein Konto? Registrieren';
  $('pass').autocomplete = reg ? 'new-password' : 'current-password';
  $('err').textContent = '';
}
$('toggle').onclick = () => setMode(!registering);
$('auth').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await fetch(registering ? '/api/register' : '/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: $('user').value, password: $('pass').value }),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { $('err').textContent = typeof j.detail === 'string' ? j.detail : 'Ungültige Eingabe'; return; }
  $('pass').value = '';
  showApp(j.username);
});
$('logout').onclick = async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
};
(async () => {
  const r = await fetch('/api/me');
  if (r.ok) showApp((await r.json()).username); else showAuth();
})();

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function submit() {
  const text = input.value.trim();
  if (!text || send.disabled) return;
  send.disabled = true;
  try {
    if (currentId === null) {
      const c = await (await api('/api/chats', { method: 'POST' })).json();
      currentId = c.id;
    }
    chat.querySelector('.hint')?.remove();
    input.value = '';
    add('user', text);
    const bot = add('bot', '…');
    let answer = '';
    const res = await api('/api/chats/' + currentId + '/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      bot.textContent = '⚠️ ' + (j.detail || 'Fehler');
    } else {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const p of parts) {
          const data = p.replace(/^data: /, '');
          if (data === '[DONE]') continue;
          const j = JSON.parse(data);
          answer += j.error ? '\n⚠️ ' + j.error : j.text;
          bot.textContent = answer;
          chat.scrollTop = chat.scrollHeight;
        }
      }
    }
  } catch (e) {
    if (e.message !== 'auth') add('bot', '⚠️ Verbindungsfehler: ' + e.message);
  }
  send.disabled = false;
  loadChats();
  input.focus();
}

document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); submit(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
</script>
</body>
</html>
