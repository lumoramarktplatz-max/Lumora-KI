services:
  - type: web
    name: lumora-ki
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false          # kostenloser Key von aistudio.google.com
      - key: ANTHROPIC_API_KEY
        sync: false          # Claude-Key für Pro-Nutzer (console.anthropic.com)
      - key: DATABASE_URL
        sync: false          # Postgres-Adresse von Neon (kostenlos), im Dashboard eintragen
      - key: LUMORA_FREE_MODEL
        value: gemini-4-hydrogen   # Gratis-Plan: Gemini (Modellname aus Google AI Studio)
      - key: LUMORA_PRO_MODEL
        value: claude-sonnet-5-5   # Pro-Plan: Claude
      - key: PAYMENTS_MODE
        sync: false          # im Render-Dashboard setzen: off = keine Bezahlung | test = simuliert | stripe = echt
      - key: ADMIN_PASSWORD
        sync: false          # optional: Start-Passwort für den Admin "Matic" (sonst VIP)
      - key: STRIPE_SECRET_KEY
        sync: false          # nur bei PAYMENTS_MODE=stripe
      - key: STRIPE_WEBHOOK_SECRET
        sync: false          # nur bei PAYMENTS_MODE=stripe
      - key: PUBLIC_URL
        sync: false          # z. B. https://lumora-ki.onrender.com (für Stripe-Rücksprung)
      - key: LUMORA_SECURE_COOKIE
        value: "1"
