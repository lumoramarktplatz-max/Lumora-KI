services:
  - type: web
    name: lumora-ki
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false          # kostenloser Key von aistudio.google.com
      - key: ANTHROPIC_API_KEY
        sync: false          # optional: nur nötig, wenn LUMORA_PROVIDER=claude
      - key: DATABASE_URL
        sync: false          # Postgres-Adresse von Neon (kostenlos), im Dashboard eintragen
      - key: LUMORA_PROVIDER
        value: gemini        # "gemini" (gratis) oder "claude"
      - key: LUMORA_SECURE_COOKIE
        value: "1"
