services:
  - type: web
    name: lumora-ki
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ANTHROPIC_API_KEY
        sync: false          # im Render-Dashboard eintragen
      - key: DATABASE_URL
        sync: false          # Postgres-Adresse von Neon (kostenlos), im Dashboard eintragen
      - key: LUMORA_MODEL
        value: claude-sonnet-5-5
      - key: LUMORA_SECURE_COOKIE
        value: "1"
